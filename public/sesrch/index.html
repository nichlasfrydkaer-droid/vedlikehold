<!doctype html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,follow">
  <title>Bildesøk | Vedlikeholdsystem</title>
  <link rel="icon" href="/icon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/icon.png">
  <link rel="stylesheet" href="/assets/search.css">
</head>
<body>
  <header class="search-header">
    <a class="brand" href="/" aria-label="Vedlikeholdsystem forside">
      <img src="/icon.png" alt="">
      <span>Vedlikehold<strong>system</strong></span>
    </a>
    <a class="back-link" href="/">Til forsiden</a>
  </header>

  <main class="search-main">
    <section class="search-intro" aria-labelledby="search-title">
      <p class="eyebrow">Bildesøk</p>
      <h1 id="search-title">Finn bilder</h1>
      <p>Søk i bilder med åpne lisenser uten å forlate Vedlikeholdsystem.</p>
    </section>

    <section class="search-panel" aria-label="Søk etter bilder">
      <form class="search-form" data-search-form role="search">
        <label class="visually-hidden" for="search-query">Bildesøk</label>
        <input id="search-query" name="q" type="search" autocomplete="off" maxlength="400" placeholder="Søk etter bilder" required>
        <button type="submit">Søk</button>
      </form>

      <p class="search-status" data-search-status aria-live="polite">Skriv inn det du vil finne bilder av.</p>
      <div class="search-results image-results" data-search-results></div>
      <p class="search-provider">Bilder leveres av Openverse. Kontroller lisensen før bruk.</p>
    </section>
  </main>
  <script src="/assets/search.js" type="module"></script>
</body>
</html>
